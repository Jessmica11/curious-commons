<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commons Board · Overlay</title>
<!--
  OBS overlay: Where To Watch + the Commoner Resources checkout slip, for the space under the clock.
  Add it in OBS as a Browser Source:  https://<your-site>/board.html
  Suggested size: 440 × 480. Leave "Custom CSS" empty.
  It follows the same live state as the site: the film you pressed Play on (or the next Coming Soon film),
  and the links you pin from the Host Desk, which appear within a few seconds.

  Options (add to the address, joined with &):
    ?only=watch      just the Where To Watch card
    ?only=slip       just the checkout slip
    &pins=4          how many of the latest pins to show (default 3)
    &scale=1.2       make everything bigger or smaller
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@1,500&family=Inter:wght@600&family=Special+Elite&display=swap">
<style>
:root{--gold:#d9b765;--goldl:#f0d890;--text:#ece4cf;--text2:#c9bfa5;--line:rgba(217,183,101,.30);
  --paper:#f7f0de;--ink:#2a2118;--muted:#4f4536;--link:#1d3f6b;--stamp:#243f73;--scale:1}
html,body{margin:0;background:transparent;overflow:hidden}
*{box-sizing:border-box}
body{display:flex;justify-content:center;padding:6px 0;font-family:Inter,system-ui,sans-serif}
.board{width:400px;display:flex;flex-direction:column;gap:14px;transform:scale(var(--scale));transform-origin:top center}

/* the site's card, framed like the clock plaque */
.card{position:relative;padding:14px 18px 16px;border-radius:14px;color:var(--text);
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0) 45%),#14201a;border:2px solid #c79a3a;
  box-shadow:0 14px 30px rgba(0,0,0,.65),inset 0 0 0 1px #6b4a10,inset 0 1px 0 rgba(255,236,170,.2)}
.card::before{content:'';position:absolute;inset:7px;border:1px solid rgba(240,210,140,.22);border-radius:9px;pointer-events:none}
h2{display:flex;align-items:center;gap:10px;margin:0 0 4px;font:700 13px Cinzel,serif;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
h2::before{content:'';flex:none;width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
h2::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.film{margin:0 0 10px;font:italic 500 19px/1.2 'Cormorant Garamond',Georgia,serif;color:#e2d6b4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:rgba(217,183,101,.10);border:1px solid rgba(217,183,101,.5);border-radius:999px;padding:3px 11px;font:600 13.5px/1.35 Inter,sans-serif;color:var(--goldl)}
.chip.free{background:rgba(217,183,101,.22);border-color:rgba(240,216,144,.8);color:#fff3c8}
.none{margin:2px 0 0;font:italic 500 17px 'Cormorant Garamond',Georgia,serif;color:var(--text2)}
.foot{margin:10px 0 0;font:600 10.5px Inter,sans-serif;letter-spacing:.06em;color:var(--text2)}

/* library checkout slip (stays paper) */
.slip{position:relative;padding:12px 14px 10px;border-radius:8px;background:var(--paper);color:var(--ink);border:1px solid #b9a77c;
  box-shadow:inset 0 0 30px rgba(107,79,29,.14),0 14px 30px rgba(0,0,0,.6);font-family:'Special Elite','Courier New',monospace}
.slip-h{text-align:center;font:700 12px Cinzel,serif;letter-spacing:.16em;text-transform:uppercase;border-bottom:3px double var(--ink);padding-bottom:6px}
.body{position:relative}
.body::before{content:'';position:absolute;top:0;bottom:0;left:84px;width:2px;background:#b3473b;opacity:.65}
.sub,.pins li{display:grid;grid-template-columns:76px 1fr;gap:14px}
.sub{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;border-bottom:2px solid var(--ink);padding:4px 0}
.pins{list-style:none;margin:0;padding:0}
.pins li{align-items:baseline;border-bottom:1px solid rgba(42,33,24,.35);padding:7px 0;min-height:40px;font-size:14px;line-height:1.3}
.pins li:last-child{border-bottom:0}
.stamp{color:var(--stamp);font-weight:700;letter-spacing:-.03em;display:inline-block;transform:rotate(-2deg)}
.note{color:var(--link);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.note small{display:block;color:var(--muted);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pins .empty{color:var(--muted);font-style:italic}
.pins li.new{animation:arrive 2.4s ease-out}
@keyframes arrive{0%{background:rgba(217,183,101,.55)}100%{background:transparent}}
@media(prefers-reduced-motion:reduce){.pins li.new{animation:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="board" id="board">
  <section class="card" id="watchCard">
    <h2>Where To Watch</h2>
    <p class="film" id="film"></p>
    <div id="watch"><p class="none">Fetching the almanac…</p></div>
    <p class="foot">US availability, from JustWatch</p>
  </section>
  <div class="slip" id="slipCard">
    <div class="slip-h">Commoner Resources</div>
    <div class="body">
      <div class="sub"><span>Time</span><span>Resource</span></div>
      <ol class="pins" id="pins"></ol>
    </div>
  </div>
</div>
<script src="commons.js"></script>
<script>
const Q=new URLSearchParams(location.search);
const POLL_MS=4000, SHEET_MS=5*60*1000, NPINS=Math.max(1,Math.min(8,parseInt(Q.get('pins'))||3));
if(Q.get('only')==='watch')$('slipCard').hidden=true;
if(Q.get('only')==='slip')$('watchCard').hidden=true;
const sc=parseFloat(Q.get('scale'));if(sc>0&&sc<5)document.documentElement.style.setProperty('--scale',sc);

let seen=new Set(), first=true, lastWatch='';
const lib=x=>/kanopy|hoopla/i.test(x);
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return''}};

/* --- Where To Watch: free and library first, the way the site labels them --- */
function renderWatch(){
  const r=S.cur, w=$('watch');
  $('film').textContent=r?r.title:'';
  if(!r){w.innerHTML='';w.append(el('p','Nothing on the Gallery Wall yet.','none'));return}
  const free=[...new Set([...r.open,...r.free])], paid=r.stream.filter(x=>!free.includes(x));
  const key=r.title+'|'+free.join()+'|'+paid.join()+'|'+(r.status||'');
  if(key===lastWatch)return;lastWatch=key;
  w.textContent='';
  if(free.length||paid.length){
    const d=el('div',null,'chips');
    free.forEach(x=>d.append(el('span',lib(x)?x+' · free with a library card':x+' · free','chip free')));
    paid.slice(0,Math.max(0,6-free.length)).forEach(x=>d.append(el('span',x.replace(/ \(rent\/buy\)$/,' · rent or buy'),'chip')));
    w.append(d);
  }else w.append(el('p',r.status?'Not listed yet. Ask in chat and we’ll help you find it.':'Looking this up…','none'));
}

/* --- checkout slip: the latest pins for this film, newest at the bottom --- */
function renderPins(){
  const forCur=p=>!p.doc||(S.cur&&p.doc.toLowerCase()===S.cur.title.toLowerCase());
  const all=S.pins.filter(forCur).slice(-NPINS), ol=$('pins');ol.textContent='';
  if(!all.length){const li=document.createElement('li');li.append(el('span',''),el('span','No resources pinned yet.','empty'));ol.append(li)}
  all.forEach(p=>{
    const id=p.id||(p.time+p.note+p.url), li=document.createElement('li'), n=el('span',p.note||host(p.url)||p.url,'note');
    if(p.note&&p.url&&host(p.url))n.append(el('small',host(p.url)));
    li.append(el('span',p.time||'—','stamp'),n);
    if(!first&&!seen.has(id))li.className='new';
    seen.add(id);ol.append(li)});
  first=false;
}

/* --- live state: same sources as the site (Netlify function first, the sheet as a fallback) --- */
async function refresh(){
  try{
    const sheetPins=load(PINS_TAB,/note/i).then(t=>t.rows.filter(r=>r.c&&(cell(r.c[1])||cell(r.c[2]))).map(r=>({time:cell(r.c[0]),note:cell(r.c[1]),url:cell(r.c[2]),doc:cell(r.c[3])}))).catch(()=>[]);
    const fn=await getLive();
    if(fn){S.liveTitle=fn.title||''}
    else{try{const t=await load(LIVE_TAB,/clock|now playing/i),r=t.rows[0]&&t.rows[0].c||[];S.liveTitle=cell(r[1])}catch(e){}}
    if(S.rows.length){const n=autoPick();if(n!==S.cur){S.cur=n;lastWatch='';if(n)enrich(n)}}
    const pins=[...await sheetPins,...(fn&&Array.isArray(fn.pins)?fn.pins:[])];
    if(JSON.stringify(pins)!==JSON.stringify(S.pins)||first){S.pins=pins;renderPins()}
    renderWatch();
  }catch(e){}
  setTimeout(refresh,POLL_MS);
}
async function loadSchedule(){
  try{S.rows=parseSchedule(await load(SCHEDULE_TAB));S.cur=null;lastWatch=''}catch(e){}
  setTimeout(loadSchedule,SHEET_MS);
}
window.onEnriched=r=>{if(r===S.cur)renderWatch()};
window.onStatus=r=>{if(r===S.cur)renderWatch()};
loadSchedule().then(refresh);
</script>
</body>
</html>
