<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <title>Commons Board · Overlay</title>
    <!--
  OBS overlay: Where To Watch + the Commoner Resources checkout slip, for the space under the clock.
  Add it in OBS as a Browser Source:  https://<your-site>/board.html
  Suggested size: 440 × 480. Leave "Custom CSS" empty.
  It follows the same live state as the site: the film you pressed Play on (or the next Opening Soon film),
  and the links you pin from the Host Desk, which appear within a few seconds.

  Options (add to the address, joined with &):
    ?only=watch      just the Where To Watch card
    ?only=slip       just the checkout slip
    &pins=4          how many of the latest pins to show (default 3)
    &scale=1.2       make everything bigger or smaller
-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@1,500&family=Inter:wght@600&family=Special+Elite&display=swap"
    />
    <link rel="stylesheet" href="board.css" />
  </head>
  <body>
    <div class="board" id="board">
      <section class="card" id="watchCard">
        <h2>Where To Watch</h2>
        <p class="film" id="film"></p>
        <div id="watch"><p class="none">Fetching the almanac…</p></div>
        <p class="foot">US availability, from JustWatch</p>
      </section>
      <div class="slip" id="slipCard">
        <div class="slip-h">Commoner Resources</div>
        <div class="body">
          <div class="sub"><span>Time</span><span>Resource</span></div>
          <ol class="pins" id="pins"></ol>
        </div>
      </div>
    </div>
    <script type="module" src="board.js"></script>
  </body>
</html>
